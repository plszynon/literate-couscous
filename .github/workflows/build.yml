name: Build PKG
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/altps3/ps3dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ps3-filemanager
          path: |
            *.pkg
            *.elf
